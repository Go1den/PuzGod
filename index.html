<!DOCTYPE html>
<html>
<head lang="en">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="HandheldFriendly" content="True">
    <title>PuzGod</title>

    <!-- jQuery -->
    <script src="lib/jquery.js"></script>

    <!-- for loading crosswords -->
    <script src="lib/jscrossword_combined.js"></script>

    <!-- confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- GG animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" integrity="sha512-16esztaSRplJROstbIIdwX3N97V1+pZvV33ABoG1H2OyTttBxEGkTsoIVsiP1iaTtM8b3+hu2kB6pQ4Clr5yug==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Shared JS -->
    <script src="js/crossword.shared.js"></script>

    <!-- Class definitions (must load before crosswords.js) -->
    <script src="js/Word.js"></script>
    <script src="js/CluesGroup.js"></script>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="./css/crossword.shared.css">

    <!-- For app downloads -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">


    <script>
      // ✅ Desktop CSS
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = './css/crosswordnexus.css';
      document.head.appendChild(link);

      // ✅ Desktop JS + Init
      const script = document.createElement('script');
      script.src = './js/crosswords.js';
      script.onload = () => {
        console.log('[Desktop] crosswords.js loaded — initializing crossword');

        const params = CrosswordShared.getCrosswordParams();

        window.gCrossword = CrosswordNexus.createCrossword($('div.crossword'), params);

        setTimeout(() => {
          const svg = document.getElementById('cw-puzzle-grid');
          const cw = window.gCrossword;

          if (svg && cw?.renderCells && cw.grid_width && cw.grid_height) {
            console.log('[Fix] Final render pass after layout settle');
            cw.renderCells();
            cw.windowResized?.();
            cw.syncTopTextWidth?.();
          } else {
            console.warn('[Fix] Skipping renderCells — grid size not yet initialized', {
              grid_width: cw?.grid_width,
              grid_height: cw?.grid_height
            });
          }
        }, 350);

        // Listen for print-puzzle IPC event from Electron menu
        if (window.electronAPI) {
          window.electronAPI.onInfo(() => {
            if (window.gCrossword && typeof window.gCrossword.showInfo === 'function') {
              window.gCrossword.showInfo();
            }
          });
          window.electronAPI.onNotepad(() => {
            if (window.gCrossword && typeof window.gCrossword.showNotepad === 'function') {
              window.gCrossword.showNotepad();
            }
          });
          window.electronAPI.onOpen(() => {
            if (window.gCrossword && typeof window.gCrossword.loadPuzzle === 'function') {
              window.gCrossword.loadPuzzle();
            }
          });
          window.electronAPI.onPrintPuzzle(() => {
            if (window.gCrossword && typeof window.gCrossword.printPuzzle === 'function') {
              window.gCrossword.printPuzzle();
            }
          });
          window.electronAPI.onSaveAs(() => {
            if (window.gCrossword && typeof window.gCrossword.saveAsIpuz === 'function') {
              window.gCrossword.saveAsIpuz();
            }
          });
          window.electronAPI.onSettings(() => {
            if (window.gCrossword && typeof window.gCrossword.openSettings === 'function') {
              window.gCrossword.openSettings();
            }
          });
          window.electronAPI.onRestart(() => {
            if (window.gCrossword && typeof window.gCrossword.clearPuzzle === 'function') {
              window.gCrossword.clearPuzzle();
            }
          });
          window.electronAPI.onCheckLetter(() => {
            if (window.gCrossword && typeof window.gCrossword.checkLetter === 'function') {
              window.gCrossword.checkLetter();
            }
          });
          window.electronAPI.onCheckWord(() => {
            if (window.gCrossword && typeof window.gCrossword.checkWord === 'function') {
              window.gCrossword.checkWord();
            }
          });
          window.electronAPI.onCheckPuzzle(() => {
            if (window.gCrossword && typeof window.gCrossword.checkPuzzle === 'function') {
              window.gCrossword.checkPuzzle();
            }
          });
          window.electronAPI.onRevealLetter(() => {
            if (window.gCrossword && typeof window.gCrossword.revealLetter === 'function') {
              window.gCrossword.revealLetter();
            }
          });
          window.electronAPI.onRevealWord(() => {
            if (window.gCrossword && typeof window.gCrossword.revealWord === 'function') {
              window.gCrossword.revealWord();
            }
          });
          window.electronAPI.onRevealPuzzle(() => {
            if (window.gCrossword && typeof window.gCrossword.revealPuzzle === 'function') {
              window.gCrossword.revealPuzzle();
            }
          });
          window.electronAPI.onRebus(() => {
            if (window.gCrossword && typeof window.gCrossword.prepareRebus === 'function') {
              window.gCrossword.prepareRebus();
            }
          });
        }
      };

      window.addEventListener('DOMContentLoaded', () => {
        document.body.appendChild(script);
      });
      </script>

      <!-- For saving the app locally -->
      <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').then(() => {
            console.log('Service Worker registered!');
          });
        }
      </script>

      <noscript>
        <p style="padding:1rem; font-family:sans-serif;">
          The Crossword Nexus Solver requires JavaScript.
        </p>
      </noscript>

</head>
<body>
    <div class="crossword"></div>
</body>
</html>
